[package]
name = "wild-magic-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[workspace]
members = ["desktop"]
exclude = ["bevy-desktop"]
resolver = "2"

[dependencies]
bevy_ecs = { version = "=0.18.1", default-features = false, features = ["std"] }
glam = { version = "=0.30.10", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }

[profile.dev]
opt-level = 1
